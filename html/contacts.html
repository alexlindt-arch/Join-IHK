<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/icons/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon/favicon.svg" />
    <link rel="shortcut icon" href="../assets/icons/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="../assets/icons/favicon/site.webmanifest" />
    <link rel="stylesheet" href="../style.css?v=20261001b">
    <link rel="stylesheet" href="../assets/css/contacts_list.css?v=20261001b">
    <link rel="stylesheet" href="../assets/css/contacts_detail.css?v=20261001b">
    <link rel="stylesheet" href="../assets/css/contacts_dialog.css?v=20261001b">
    <link rel="stylesheet" href="../assets/css/contacts_mobile.css?v=20261001b">
    <link rel="stylesheet" href="../assets/css/contacts_responsive.css?v=20261001b">
    <link rel="stylesheet" href="../assets/css/contacts_desktop.css?v=20261001b">
    <link rel="stylesheet" href="../assets/css/features.css?v=20261001b">
    <link rel="stylesheet" href="../assets/css/profile.css?v=20261001b">
    <title>Contacts</title>
</head>

<body class="app-page" onload="init()">
    <div class="header-background">
        <header class="header">
            <span class="header-titel">Kanban Project Management Tool</span>
            <img src="../assets/img/logo_big.svg" class="header-logo-mobil" alt="Join">

            <div class="header-account">
                <a href="../html/help.html" class="help-icon-link" title="Help">
                    <img src="../assets/icons/help.svg" alt="" class="help-icon">
                </a>

                <div class="avatar-wrapper" id="user-avatar-wrapper">
                    <button type="button" class="user-avatar" id="user-avatar" aria-label="Open account menu"
                        aria-haspopup="true" aria-expanded="false" aria-controls="avatar-menu"
                        onclick="toggleAvatarMenu()"></button>
                    <div class="avatar-dropdown d-none" id="avatar-menu">
                        <button type="button" class="avatar-menu-btn avatar-menu-btn--profile"
                            onclick="openProfileDialog(); event.stopPropagation()">Account</button>
                        <a class="avatar-menu-btn avatar-menu-btn--mobile-only" href="help.html">Help</a>
                        <a class="avatar-menu-btn" href="legal_notice.html">Legal Notice</a>
                        <a class="avatar-menu-btn" href="privacy_policy.html">Privacy Policy</a>
                        <button type="button" class="avatar-menu-btn" onclick="logout(); event.stopPropagation()">Log out</button>
                    </div>
                </div>
            </div>
        </header>
    </div>

    <nav class="sidebar">
        <a href="../html/summary.html" class="sidebar-logo-link">
            <img src="../assets/img/logo_white.svg" alt="Join Logo" class="sidebar-logo">
        </a>

        <div class="navigation-links-group">
            <a href="../html/summary.html" class="nav-link" id="nav_overview">
                <img src="../assets/icons/summary.svg" alt="" class="nav-icon">
                <span>Summary</span>
            </a>
            <a href="../html/add_task.html" class="nav-link" id="nav_addtask">
                <img src="../assets/icons/add_task.svg" alt="" class="nav-icon">
                <span>Add Task</span>
            </a>
            <a href="../html/board.html" class="nav-link" id="nav_board">
                <img src="../assets/icons/board.svg" alt="" class="nav-icon">
                <span>Board</span>
            </a>
            <a href="../html/contacts.html" class="nav-link" id="nav_contacts">
                <img src="../assets/icons/contacts.svg" alt="" class="nav-icon">
                <span>Contacts</span>
            </a>
        </div>

        <div class="nav-bottom-left">
            <a href="../html/privacy_policy.html" class="nav-link">Privacy Policy</a>
            <a href="../html/legal_notice.html" class="nav-link">Legal Notice</a>
        </div>
    </nav>

    <nav class="mobil-navigation">
        <a href="../html/summary.html" class="mobil-nav-link">
            <img src="../assets/icons/summary.svg" alt="" class="mobil-nav-icon">
            <span>Summary</span>
        </a>
        <a href="../html/add_task.html" class="mobil-nav-link">
            <img src="../assets/icons/add_task.svg" alt="" class="mobil-nav-icon">
            <span>Add Task</span>
        </a>
        <a href="../html/board.html" class="mobil-nav-link">
            <img src="../assets/icons/board.svg" alt="" class="mobil-nav-icon">
            <span>Board</span>
        </a>
        <a href="../html/contacts.html" class="mobil-nav-link">
            <img src="../assets/icons/contacts.svg" alt="" class="mobil-nav-icon">
            <span>Contacts</span>
        </a>
    </nav>

    <div class="landscape-warning">
        <img src="../assets/img/logo_big.svg" alt="Join">
        <p>Please turn your device to portrait mode.</p>
    </div>

    <div class="main-wrapper">


        <main class="contacts-main">

            <section class="contacts-split-left" aria-label="Contact list">

                <div class="contacts-list">
                    <div class="btn-add-contact">
                        <button type="button" onclick="openAddContactModal()" aria-label="Add new contact">
                            <span class="for-mobile-hide">Add new contact</span>
                            <img src="../assets/icons/person_add.svg" alt="" class="fab-icon">
                        </button>
                    </div>
                    <div class="contact-item-placeholder" id="contacts-list-import" aria-live="polite"></div>
                </div>
            </section>

            <section class="contacts-split-right for-mobile-hide" aria-labelledby="contacts-heading">

                <div class="brand-header">
                    <h1 class="brand-title" id="contacts-heading">Contacts</h1>
                    <div class="brand-divider"></div>
                    <span class="brand-subtitle">Better with a team</span>

                    <button type="button" class="btn-back-mobile" onclick="resetMobileContactView()"
                        aria-label="Back to contact list">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true">
                            <path d="M20 11H7.83L13.42 5.41L12 4L4 12L12 20L13.41 18.59L7.83 13H20V11Z"
                                fill="#29ABE2" />
                        </svg>
                    </button>
                </div>

                <div class="contact-profile" id="contact-details-view" aria-live="polite"
                    aria-label="Contact details">
                </div>
            </section>
        </main>
    </div>

    <dialog id="add-contact-dialog" aria-labelledby="contact-dialog-title" onclick="closeDialogOnBackdrop(event)">
    </dialog>



    <script src="../js/config.js?v=20261001b"></script>
    <script src="../js/image_utils.js?v=20261001b"></script>
    <script src="../assets/templates/contacts_template.js?v=20261001b"></script>
    <script src="../js/contacts/contacts.js?v=20261001b"></script>
    <script src="../js/contacts/contacts_store.js?v=20261001b"></script>
    <script src="../js/contacts/contact_sync.js?v=20261001b"></script>
    <script src="../js/contacts/contact_validation.js?v=20261001b"></script>
    <script src="../js/contacts/contact_add_edit.js?v=20261001b"></script>
    <script src="../script.js?v=20261001b"></script>
    <script src="../js/guest_session.js?v=20261001b"></script>


    <script src="../assets/templates/profile_template.js?v=20261001b"></script>
    <script src="../js/profile/profile.js?v=20261001b"></script>
    <script src="../js/profile/profile_store.js?v=20261001b"></script>
    <script src="../js/profile/profile_guest.js?v=20261001b"></script>
</body>

</html>
